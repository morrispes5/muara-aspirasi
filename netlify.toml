[build]
  # Netlify's Next runtime bundles the admin proxy as an Edge Function. Use
  # webpack here because the Turbopack middleware artifact cannot be bundled
  # reliably by the current Windows Netlify CLI path resolver.
  command = "npm run build -- --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.16.0"

[dev]
  command = "npm run dev"
  framework = "#auto"
  targetPort = 3000
